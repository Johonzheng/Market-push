name: Daily Index Valuation WeChat Push

on:
  # 每天北京时间下午 16:00 自动执行 (GitHub Actions 使用 UTC 时间，16:00 CST = 08:00 UTC)
  schedule:
    - cron: '0 8 * * *'
  # 支持在 GitHub 页面手动点击 "Run workflow" 立即测试推送
  workflow_dispatch:

jobs:
  valuation-push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 1. 检出仓库代码与配置文件
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境（启用依赖缓存）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/daily_valuation.yml'

      - name: 3. 极速安装轻量依赖库（无需 Matplotlib 与字体包，3秒完成）
        run: |
          pip install pandas numpy requests openpyxl

      - name: 4. 并发拉取多维估值数据并推送到个人微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
        run: |
          python valuation_push.py --config indices.json
